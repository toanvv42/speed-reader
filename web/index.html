<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>speed-reader</title>
<style>
:root {
  --fg: #e6e6e6;
  --bg: #101014;
  --dim: #8c8c8c;
  --accent: #ff5050;
  --status-bg: #14141e;
  --status-fg: #b4b4b4;
  --modal-bg: #12121899;
  --input-bg: #1a1a24;
  --border: #3c3c50;
}
@media (prefers-color-scheme: light) {
  :root {
    --fg: #1e1e23;
    --bg: #faf9f5;
    --dim: #78787e;
    --accent: #c82828;
    --status-bg: #e8e6de;
    --status-fg: #46464e;
    --modal-bg: #faf9f5dd;
    --input-bg: #fff;
    --border: #c8c6be;
  }
}
[data-theme="dark"] {
  --fg: #e6e6e6;
  --bg: #101014;
  --dim: #8c8c8c;
  --accent: #ff5050;
  --status-bg: #14141e;
  --status-fg: #b4b4b4;
  --modal-bg: #12121899;
  --input-bg: #1a1a24;
  --border: #3c3c50;
}
[data-theme="light"] {
  --fg: #1e1e23;
  --bg: #faf9f5;
  --dim: #78787e;
  --accent: #c82828;
  --status-bg: #e8e6de;
  --status-fg: #46464e;
  --modal-bg: #faf9f5dd;
  --input-bg: #fff;
  --border: #c8c6be;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}
#reader {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 0.5rem;
  min-height: 0;
}
#word {
  font-size: clamp(2rem, 8vw, 5rem);
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
#word .orp { color: var(--accent); }
#kind-hint {
  font-size: 0.85rem;
  color: var(--dim);
}
#image-display {
  max-width: 80%;
  max-height: 60vh;
  object-fit: contain;
  display: none;
}
#image-caption {
  font-size: 0.8rem;
  color: var(--dim);
  display: none;
  text-align: center;
}
#status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  padding: 0.4rem 1rem;
  background: var(--status-bg);
  color: var(--status-fg);
  font-size: 0.8rem;
  flex-wrap: wrap;
}
#status button {
  background: none;
  border: 1px solid var(--border);
  color: var(--status-fg);
  padding: 0.2rem 0.6rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
}
#status button:hover { color: var(--accent); border-color: var(--accent); }
#wpm-display { min-width: 5ch; text-align: center; }
#progress { min-width: 7ch; text-align: center; }

/* Input overlay */
#input-overlay {
  position: fixed;
  inset: 0;
  background: var(--modal-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  backdrop-filter: blur(4px);
}
#input-overlay.hidden { display: none; }
#input-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  width: min(90vw, 600px);
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
#input-box h2 { font-size: 1.1rem; font-weight: 600; }
#input-box textarea {
  width: 100%;
  height: 200px;
  background: var(--input-bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.75rem;
  font-family: ui-monospace, monospace;
  font-size: 0.85rem;
  resize: vertical;
}
#input-box .actions {
  display: flex;
  gap: 0.75rem;
  align-items: center;
}
#input-box .actions button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 0.5rem 1.2rem;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
}
#input-box .actions label {
  font-size: 0.8rem;
  color: var(--dim);
  cursor: pointer;
}
#drop-hint {
  font-size: 0.8rem;
  color: var(--dim);
}

/* Help dialog */
dialog {
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  max-width: 400px;
}
dialog::backdrop { background: rgba(0,0,0,0.4); }
dialog h3 { margin-bottom: 0.75rem; }
dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1rem; font-size: 0.85rem; }
dialog dt { font-weight: 600; color: var(--accent); }
dialog dd { color: var(--fg); }
dialog button.close {
  margin-top: 1rem;
  background: none;
  border: 1px solid var(--border);
  color: var(--fg);
  padding: 0.3rem 0.8rem;
  border-radius: 4px;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- Reader view -->
<div id="reader">
  <div id="word"></div>
  <div id="kind-hint"></div>
  <img id="image-display" alt="">
  <div id="image-caption"></div>
</div>

<!-- Status bar -->
<div id="status">
  <button id="btn-open" title="Open (Ctrl+O)">📂</button>
  <button id="btn-prev" title="Previous (←)">◀</button>
  <button id="btn-play" title="Play/Pause (Space)">▶</button>
  <button id="btn-next" title="Next (→)">▶▸</button>
  <button id="btn-wpm-down" title="Slower (↓)">−</button>
  <span id="wpm-display">300 wpm</span>
  <button id="btn-wpm-up" title="Faster (↑)">+</button>
  <span id="progress">0/0</span>
  <button id="btn-theme" title="Theme (t)">🌓</button>
  <button id="btn-help" title="Help (?)">?</button>
</div>

<!-- Input overlay -->
<div id="input-overlay">
  <div id="input-box">
    <h2>speed-reader</h2>
    <textarea id="md-input" placeholder="Paste your markdown here…"></textarea>
    <div class="actions">
      <button id="btn-load">Read →</button>
      <label>
        <input type="file" id="file-input" accept=".md,.markdown,.mdx,.txt" hidden>
        <span style="text-decoration:underline;cursor:pointer">or open a file…</span>
      </label>
    </div>
    <div id="drop-hint">or drag &amp; drop a .md file anywhere on this page</div>
  </div>
</div>

<!-- Help dialog -->
<dialog id="help-dialog">
  <h3>speed-reader — help</h3>
  <dl>
    <dt>Space</dt><dd>play / pause</dd>
    <dt>← → or h l</dt><dd>step word</dd>
    <dt>↑ ↓ or + −</dt><dd>WPM ±25</dd>
    <dt>Ctrl+O or o</dt><dd>open file / paste</dd>
    <dt>t</dt><dd>cycle theme</dd>
    <dt>?</dt><dd>toggle help</dd>
  </dl>
  <button class="close" id="btn-close-help">Close</button>
</dialog>

<script type="module">
// WASM_INLINE_MARKER: this block gets replaced by the build script
import init, { WebReader } from './pkg/speed_reader.js';
await init();
// END_WASM_INLINE_MARKER

let reader = null;
let wpm = 300;
let imagePauseMs = 3000;
let timer = null;
const themes = ['system', 'dark', 'light'];
let themeIdx = 0;

const $word = document.getElementById('word');
const $hint = document.getElementById('kind-hint');
const $img = document.getElementById('image-display');
const $imgCaption = document.getElementById('image-caption');
const $play = document.getElementById('btn-play');
const $wpmDisplay = document.getElementById('wpm-display');
const $progress = document.getElementById('progress');
const $overlay = document.getElementById('input-overlay');
const $mdInput = document.getElementById('md-input');
const $help = document.getElementById('help-dialog');

function render() {
  if (!reader || reader.total() === 0) {
    $word.textContent = '';
    $hint.textContent = '';
    $img.style.display = 'none';
    $imgCaption.style.display = 'none';
    $progress.textContent = '0/0';
    return;
  }

  const kind = reader.kind();
  const text = reader.text();
  const orp = reader.orp();
  const url = reader.imageUrl();

  if (kind === 'image' && url) {
    $word.textContent = '';
    $hint.textContent = '';
    // Resolve relative paths via blobMap (from multi-file drag-drop)
    const filename = url.split('/').pop();
    const resolved = url.startsWith('http') ? url : (blobMap[url] || blobMap[filename] || url);
    $img.src = resolved;
    $img.style.display = 'block';
    $imgCaption.textContent = url;
    $imgCaption.style.display = 'block';
  } else {
    $img.style.display = 'none';
    $imgCaption.style.display = 'none';

    if (kind === 'paragraph') {
      $word.innerHTML = '<span style="color:var(--dim)">¶</span>';
      $hint.textContent = '';
    } else {
      const chars = [...text];
      const spans = chars.map((c, i) =>
        i === orp
          ? `<span class="orp">${esc(c)}</span>`
          : esc(c)
      ).join('');
      $word.innerHTML = spans;

      $hint.textContent = kind === 'heading' ? '— heading —'
                        : kind === 'code'    ? '— code —'
                        : '';
    }
  }

  $progress.textContent = `${reader.index() + 1}/${reader.total()}`;
  $play.textContent = reader.isPlaying() ? '⏸' : '▶';
  $wpmDisplay.textContent = `${wpm} wpm`;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scheduleNext() {
  stopTimer();
  if (!reader || !reader.isPlaying()) return;
  const ms = reader.chunkDurationMs(wpm, imagePauseMs);
  timer = setTimeout(tick, ms);
}

function tick() {
  if (!reader || !reader.isPlaying()) return;
  if (reader.atEnd()) {
    reader.setPlaying(false);
    render();
    return;
  }
  reader.advance();
  render();
  scheduleNext();
}

function stopTimer() {
  if (timer !== null) { clearTimeout(timer); timer = null; }
}

function togglePlay() {
  if (!reader || reader.total() === 0) return;
  reader.togglePlay();
  render();
  if (reader.isPlaying()) scheduleNext();
  else stopTimer();
}

function loadMarkdown(md) {
  stopTimer();
  if (reader) reader.free();
  reader = new WebReader(md);
  $overlay.classList.add('hidden');
  render();
}

// --- Controls ---
document.getElementById('btn-play').addEventListener('click', togglePlay);

document.getElementById('btn-next').addEventListener('click', () => {
  if (!reader) return;
  reader.setPlaying(false);
  stopTimer();
  reader.advance();
  render();
});

document.getElementById('btn-prev').addEventListener('click', () => {
  if (!reader) return;
  reader.setPlaying(false);
  stopTimer();
  reader.retreat();
  render();
});

document.getElementById('btn-wpm-up').addEventListener('click', () => {
  wpm = Math.min(wpm + 25, 1500);
  $wpmDisplay.textContent = `${wpm} wpm`;
});

document.getElementById('btn-wpm-down').addEventListener('click', () => {
  wpm = Math.max(wpm - 25, 50);
  $wpmDisplay.textContent = `${wpm} wpm`;
});

document.getElementById('btn-open').addEventListener('click', () => {
  stopTimer();
  if (reader) reader.setPlaying(false);
  $overlay.classList.remove('hidden');
  $mdInput.focus();
});

document.getElementById('btn-load').addEventListener('click', () => {
  const md = $mdInput.value.trim();
  if (md) loadMarkdown(md);
});

document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  file.text().then(md => { $mdInput.value = md; loadMarkdown(md); });
});

document.getElementById('btn-theme').addEventListener('click', cycleTheme);

document.getElementById('btn-help').addEventListener('click', () => {
  $help.showModal();
});
document.getElementById('btn-close-help').addEventListener('click', () => {
  $help.close();
});

function cycleTheme() {
  themeIdx = (themeIdx + 1) % themes.length;
  const t = themes[themeIdx];
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

// --- Drag & drop (supports multi-file: .md + images) ---
const blobMap = {};  // filename → blob URL for relative image resolution
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files];
  let mdFile = null;
  for (const f of files) {
    const name = f.name.toLowerCase();
    if (name.endsWith('.md') || name.endsWith('.markdown') || name.endsWith('.mdx') || name.endsWith('.txt')) {
      mdFile = f;
    } else if (f.type.startsWith('image/')) {
      blobMap[f.name] = URL.createObjectURL(f);
    }
  }
  if (mdFile) {
    const md = await mdFile.text();
    loadMarkdown(md);
  }
});

// --- Keyboard shortcuts ---
document.addEventListener('keydown', e => {
  // Don't capture when typing in textarea
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') { $overlay.classList.add('hidden'); render(); }
    return;
  }
  if ($help.open && (e.key === 'Escape' || e.key === '?')) {
    $help.close(); return;
  }
  switch (e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowRight': case 'l':
      if (reader) { reader.setPlaying(false); stopTimer(); reader.advance(); render(); }
      break;
    case 'ArrowLeft': case 'h':
      if (reader) { reader.setPlaying(false); stopTimer(); reader.retreat(); render(); }
      break;
    case 'ArrowUp': case '+': case '=':
      wpm = Math.min(wpm + 25, 1500);
      $wpmDisplay.textContent = `${wpm} wpm`;
      break;
    case 'ArrowDown': case '-':
      wpm = Math.max(wpm - 25, 50);
      $wpmDisplay.textContent = `${wpm} wpm`;
      break;
    case 'o':
      if (!e.ctrlKey) {
        stopTimer(); if (reader) reader.setPlaying(false);
        $overlay.classList.remove('hidden'); $mdInput.focus();
      }
      break;
    case 'O':
      if (e.ctrlKey) {
        e.preventDefault();
        stopTimer(); if (reader) reader.setPlaying(false);
        $overlay.classList.remove('hidden'); $mdInput.focus();
      }
      break;
    case 't':
      cycleTheme();
      break;
    case '?':
      $help.showModal();
      break;
  }
});

// Handle Ctrl+O
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'o') {
    e.preventDefault();
    stopTimer(); if (reader) reader.setPlaying(false);
    $overlay.classList.remove('hidden'); $mdInput.focus();
  }
});

// --- URL param: ?src= ---
const srcParam = new URLSearchParams(location.search).get('src');
if (srcParam) {
  fetch(srcParam)
    .then(r => r.text())
    .then(md => loadMarkdown(md))
    .catch(err => console.error('Failed to fetch ?src=', err));
}
</script>
</body>
</html>
