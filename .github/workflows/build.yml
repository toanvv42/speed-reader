name: Build and Release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: 0.14.0

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [ x86_64-apple-darwin, aarch64-apple-darwin ]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Package Artifact
      run: |
        cd target/${{ matrix.target }}/release/
        tar -czf ../../../speed-reader-${{ matrix.target }}.tar.gz speed-reader
        cd -

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: speed-reader-${{ matrix.target }}
        path: speed-reader-${{ matrix.target }}.tar.gz

  wasm-build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --version ${{ env.WASM_PACK_VERSION }} --locked

      - name: Build WASM + inline HTML
        run: ./scripts/build-web.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speed-reader-web
          path: dist/index.html

  release:
    name: Create Release
    needs: [build, wasm-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/index.html
          generate_release_notes: true
